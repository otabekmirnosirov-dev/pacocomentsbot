name: Комментарии YouTube → Telegram

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub иногда запускает с опозданием)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять state.json

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}            # необязательно
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}  # необязательно
      - name: Сохранить state.json
        run: |
          git config user.name "comments-bot"
          git config user.email "comments-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
